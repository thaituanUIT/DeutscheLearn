[project]
name = "german-word-quiz"
version = "0.1.0"
description = "Anonymous German word quiz with endless leaderboard"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "duden>=0.19.2",
    "fastapi>=0.116.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
