services:
  - type: web
    name: deutschelearn
    env: python
    plan: free
    buildCommand: uv sync --locked --no-dev && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ADMIN_TOKEN
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBEDDING_MODEL
        value: embed-multilingual-v3.0
      - key: COHERE_EMBEDDING_DIMENSION
        value: "1024"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_CHAT_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_CHAT_FALLBACK_MODELS
        value: openrouter/free
      - key: GRAMMAR_SIMILARITY_THRESHOLD
        value: "0.45"
      - key: GRAMMAR_RELATIVE_SIMILARITY_THRESHOLD
        value: "0.85"
      - key: GRAMMAR_MIN_QUERY_WORDS
        value: "3"
      - key: DATABASE_URL
        sync: false
